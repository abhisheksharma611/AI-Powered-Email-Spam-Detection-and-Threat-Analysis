<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture — Spam Protection Webapp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Calibri,"Segoe UI",sans-serif;background:#d4d4d4;padding:24px}
.slide{max-width:1100px;margin:0 auto;background:#e9e9e9}
svg{display:block;width:100%;height:auto}
.cap{max-width:1100px;margin:10px auto 0;color:#2b2b2b;font-size:12.5px;line-height:1.6}

<body>
<div class="slide">
<svg viewBox="0 0 1100 800" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Layered system architecture of the Spam Protection webapp</title>
<desc id="arch-desc">Request flow from browser through Flask server and AI pipeline into SQLite storage, with Google services on the side.</desc>
<rect x="0" y="0" width="1100" height="800" fill="#e9e9e9"/>
<path d="M0,0 H1100 V96 Q720,168 0,116 Z" fill="#1d1333"/>
<rect x="1020" y="0" width="52" height="60" fill="#a12556"/>
<text x="120" y="72" font-size="40" font-weight="bold" fill="#e0507c" font-family="Arial">SYSTEM ARCHITECTURE</text>
<path d="M0,116 Q720,168 1100,96 L1100,124 Q720,196 0,144 Z" fill="#2c2148"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<!-- layer tags -->
<g font-size="13" fill="#555" font-family="Arial" letter-spacing="2">
<text x="60" y="240">CLIENT</text><text x="60" y="348">SERVER</text><text x="60" y="468">AI LAYER</text><text x="60" y="584">DATA</text>
</g>
<!-- arrows first -->
<g stroke-width="2.5" fill="none">
<line x1="548" y1="268" x2="548" y2="292" stroke="#4f5d75" marker-end="url(#arr)"/>
<line x1="720" y1="336" x2="756" y2="336" stroke="#2e5aa8" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
<line x1="548" y1="380" x2="548" y2="404" stroke="#4f5d75" marker-end="url(#arr)"/>
<line x1="548" y1="508" x2="548" y2="532" stroke="#4f5d75" marker-end="url(#arr)"/>
<path d="M380 576 H340 Q332 576 332 568 V348 Q332 340 340 340 H372" stroke="#4f5d75" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<line x1="720" y1="452" x2="756" y2="452" stroke="#4f5d75" stroke-dasharray="7 5" marker-end="url(#arr)"/>
</g>
<!-- arrow labels with masks -->
<g font-size="11" fill="#555" font-family="Arial" text-anchor="middle">
<rect x="560" y="270" width="52" height="14" fill="#e9e9e9"/><text x="586" y="281">HTTPS</text>
<rect x="700" y="308" width="76" height="14" fill="#e9e9e9"/><text x="738" y="319">login+fetch</text>
<rect x="560" y="532" width="56" height="14" fill="#e9e9e9"/><text x="588" y="543">records</text>
<rect x="196" y="440" width="112" height="14" fill="#e9e9e9"/><text x="252" y="451">reads for pages</text>
<rect x="700" y="424" width="56" height="14" fill="#e9e9e9"/><text x="728" y="435">optional</text>
</g>
<!-- nodes -->
<g text-anchor="middle" font-family="Arial">
<rect x="380" y="196" width="340" height="72" rx="8" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
<text x="550" y="225" font-size="16" font-weight="bold" fill="#111">Browser UI</text>
<text x="550" y="247" font-size="11" fill="#555">dashboard · results · charts + scan progress</text>
<rect x="380" y="300" width="340" height="80" rx="8" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
<text x="550" y="329" font-size="16" font-weight="bold" fill="#111">Flask Server (app.py)</text>
<text x="550" y="351" font-size="11" fill="#555">auth guard · rate limits · sync + background scans</text>
<rect x="380" y="412" width="340" height="96" rx="8" fill="#fff5f6" stroke="#a12556" stroke-width="2.5"/>
<text x="550" y="441" font-size="16" font-weight="bold" fill="#111">AI + Risk Pipeline</text>
<text x="550" y="463" font-size="11" fill="#555">fetch → clean → vote → score</text>
<text x="550" y="483" font-size="11" fill="#555">RoBERTa 90/10 · urgency/sender/keywords → 0–100</text>
<rect x="380" y="540" width="340" height="72" rx="8" fill="#f0f0f0" stroke="#555" stroke-width="2"/>
<text x="550" y="569" font-size="16" font-weight="bold" fill="#111">SQLite Storage</text>
<text x="550" y="591" font-size="11" fill="#555">email · reputation · keywords · tokens</text>
<rect x="764" y="300" width="216" height="80" rx="8" fill="#f4f4f4" stroke="#2e5aa8" stroke-width="2"/>
<text x="872" y="329" font-size="15" font-weight="bold" fill="#111">Google Services</text>
<text x="872" y="351" font-size="11" fill="#555">OAuth login · Gmail API</text>
<rect x="764" y="412" width="216" height="72" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="872" y="441" font-size="15" font-weight="bold" fill="#111">NVIDIA NIM</text>
<text x="872" y="463" font-size="11" fill="#555">one sentence · 15 s · skips silently</text>
</g>
<!-- legend + footer -->
<line x1="60" y1="660" x2="1040" y2="660" stroke="#999" stroke-width="1"/>
<text x="60" y="684" font-size="11" fill="#555" font-family="Arial">LEGEND — solid: request flow · blue: Google systems · dashed: optional / return reads</text>
<rect x="0" y="748" width="1100" height="52" fill="#111"/>
<rect x="1048" y="748" width="52" height="52" fill="#a12556"/>
</svg>
</div>
<p class="cap">One straight flow: <code>Browser → Flask → Pipeline → SQLite</code>, Google on the side, NIM optional. Sync scans and background tasks share the same <code>_process_single_email</code> pipeline — that shared path is the key viva sentence. Everything runs local-first; only login tokens and mail fetches touch Google.</p>
